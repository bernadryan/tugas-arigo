<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Daftar Handphone</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #10b981;
            --dark: #0f172a;
            --light: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-hover: 0 12px 30px rgba(0,0,0,0.15);
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%; right: -10%;
            width: 300px; height: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -30%; left: -5%;
            width: 200px; height: 200px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }

        header h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 0.5rem; position: relative; z-index: 1; }
        header p { font-size: 1rem; opacity: 0.9; position: relative; z-index: 1; }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }

        .api-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(16, 185, 129, 0.15);
            color: var(--secondary);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .api-badge::before {
            content: '';
            width: 8px; height: 8px;
            background: var(--secondary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .filter-section {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }
        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 1rem; top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
        }

        .brand-filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .filter-btn {
            padding: 0.6rem 1.2rem;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
            color: var(--text);
        }
        .filter-btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }
        .filter-btn.active {
            background: var(--primary); color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(99,102,241,0.3);
        }

        .hp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .shimmer-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .shimmer-img {
            width: 100%; height: 220px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .shimmer-body { padding: 1.5rem; }
        .shimmer-line {
            height: 16px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
            margin-bottom: 0.8rem;
        }
        .shimmer-line.short { width: 60%; }
        .shimmer-line.medium { width: 80%; height: 40px; }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .hp-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }
        .hp-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: var(--shadow-hover); }
        .hp-card.hidden { display: none; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-image {
            width: 100%; height: 220px;
            object-fit: cover;
            transition: transform 0.5s ease;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
        }
        .hp-card:hover .card-image { transform: scale(1.08); }
        .image-wrapper { overflow: hidden; position: relative; }

        .brand-badge {
            position: absolute;
            top: 1rem; left: 1rem;
            background: rgba(255,255,255,0.95);
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stock-badge {
            position: absolute;
            top: 1rem; right: 1rem;
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }
        .stock-badge.tersedia { background: rgba(16, 185, 129, 0.15); color: #059669; }
        .stock-badge.habis { background: rgba(239, 68, 68, 0.15); color: #dc2626; }

        .card-content { padding: 1.5rem; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
        .card-title { font-size: 1.15rem; font-weight: 600; color: var(--dark); line-height: 1.3; }
        .card-price { font-size: 1.2rem; font-weight: 700; color: var(--primary); white-space: nowrap; margin-left: 0.5rem; }
        .card-specs {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }
        .spec-tag {
            background: #f1f5f9;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--text-light);
            font-weight: 500;
        }
        .card-desc {
            font-size: 0.85rem; color: var(--text-light);
            line-height: 1.6; margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 0.8rem; border-top: 1px solid #f1f5f9;
        }
        .rating { display: flex; align-items: center; gap: 0.3rem; font-size: 0.85rem; font-weight: 600; color: #f5a623; }
        .rating-star { font-size: 1rem; }
        .detail-btn {
            background: var(--primary); color: white; border: none;
            padding: 0.5rem 1.2rem; border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.8rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
        }
        .detail-btn:hover { background: var(--primary-dark); transform: scale(1.05); }

        .modal-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
            padding: 1rem;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: white; border-radius: var(--radius);
            max-width: 500px; width: 100%;
            max-height: 90vh; overflow-y: auto;
            transform: scale(0.8) translateY(20px);
            transition: all 0.3s ease;
            position: relative;
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
        .modal-image { width: 100%; height: 280px; object-fit: cover; background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); }
        .modal-body { padding: 1.5rem; }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
        .modal-title { font-size: 1.4rem; font-weight: 700; color: var(--dark); }
        .modal-price { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
        .modal-desc { font-size: 0.9rem; color: var(--text-light); line-height: 1.7; margin-bottom: 1.5rem; }
        .modal-meta { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .meta-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: var(--text); }
        .meta-icon { font-size: 1.1rem; }
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .spec-item {
            background: #f8fafc;
            padding: 0.8rem;
            border-radius: 10px;
            text-align: center;
        }
        .spec-label { font-size: 0.75rem; color: var(--text-light); margin-bottom: 0.3rem; }
        .spec-value { font-size: 0.9rem; font-weight: 600; color: var(--dark); }
        .modal-close {
            position: absolute; top: 1rem; right: 1rem;
            background: rgba(255,255,255,0.9); border: none;
            width: 36px; height: 36px; border-radius: 50%;
            cursor: pointer; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .modal-close:hover { background: white; transform: rotate(90deg); }
        .modal-buy-btn {
            width: 100%; padding: 1rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white; border: none; border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
        }
        .modal-buy-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99,102,241,0.3); }

        .no-results { text-align: center; padding: 3rem 1rem; color: var(--text-light); display: none; }
        .no-results.show { display: block; }
        .no-results-icon { font-size: 3rem; margin-bottom: 1rem; }

        .error-toast {
            position: fixed; bottom: 2rem; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--dark); color: white;
            padding: 1rem 1.5rem; border-radius: 12px;
            font-size: 0.9rem; font-weight: 500;
            box-shadow: var(--shadow-hover);
            z-index: 2000;
            opacity: 0; transition: all 0.4s ease;
            display: flex; align-items: center; gap: 0.6rem;
        }
        .error-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        footer { text-align: center; padding: 2rem 1rem; color: var(--text-light); font-size: 0.85rem; }

        @media (max-width: 768px) {
            header h1 { font-size: 1.6rem; }
            .hp-grid { grid-template-columns: 1fr; }
            .filter-section { flex-direction: column; align-items: stretch; }
            .search-box { min-width: 100%; }
            .brand-filters { justify-content: center; }
            .modal-content { max-height: 85vh; }
            .specs-grid { grid-template-columns: 1fr; }
        }
        @media (min-width: 769px) and (max-width: 1024px) {
            .hp-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

            <div class="shimmer-card"><div class="shimmer-img"></div><div class="shimmer-body"><div class="shimmer-line"></div><div class="shimmer-line short"></div><div class="shimmer-line medium"></div></div></div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">

            <img class="modal-image" id="modalImage" src="" alt="">
            <div class="modal-body">
                <div class="modal-header">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <span class="modal-price" id="modalPrice"></span>
                </div>
                <div class="modal-meta">
                    <div class="meta-item">
                        <span class="meta-icon">🏷️</span>
                        <span id="modalBrand"></span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-icon">⭐</span>

        const hpGrid = document.getElementById('hpGrid');

        const modalImage = document.getElementById('modalImage');

        const modalPrice = document.getElementById('modalPrice');

        // ============================================
        // PERBAIKAN: Normalisasi brand ke huruf kapital
        // ============================================
        function normalizeBrand(brand) {
            if (!brand) return "Lainnya";
            const b = brand.toString().trim();
            // Mapping berbagai variasi penulisan brand
            const brandMap = {
                'samsung': 'Samsung',
                'apple': 'Apple',
                'xiaomi': 'Xiaomi',
                'oppo': 'OPPO',
                'vivo': 'Vivo',
                'huawei': 'Huawei',
                'realme': 'Realme',
                'oneplus': 'OnePlus',
                'google': 'Google',
                'sony': 'Sony'
            };
            const lower = b.toLowerCase();
            return brandMap[lower] || b.charAt(0).toUpperCase() + b.slice(1).toLowerCase();
        }

        // Mapping data API ke format aplikasi
        function mapApiData(products) {
            const specsPool = [
                { layar: "6.8" AMOLED", ram: "12GB", storage: "256GB", baterai: "5000mAh" },
                { layar: "6.7" OLED", ram: "8GB", storage: "256GB", baterai: "4422mAh" },
                { layar: "6.73" AMOLED", ram: "16GB", storage: "512GB", baterai: "5300mAh" },
                { layar: "6.82" AMOLED", ram: "16GB", storage: "256GB", baterai: "5000mAh" },
                { layar: "7.6" Foldable", ram: "12GB", storage: "512GB", baterai: "4400mAh" },
                { layar: "6.1" OLED", ram: "6GB", storage: "128GB", baterai: "3349mAh" }
            ];

            return products.slice(0, 6).map((product, index) => ({
                id: product.id,
                nama: product.title,
                harga: `Rp ${(product.price * 15000).toLocaleString('id-ID')}`,
                brand: normalizeBrand(product.brand),
                deskripsi: product.description ? product.description.substring(0, 150) + "..." : "Deskripsi tidak tersedia.",
                rating: product.rating,
                stok: product.stock > 0 ? "Tersedia" : "Habis",
                gambar: product.thumbnail || (product.images && product.images[0]) || '',
                specs: specsPool[index % specsPool.length]
            }));
        }

        // Fetch data dari API
        async function fetchHpData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();

                if (data.products && data.products.length > 0) {
                    hpData = mapApiData(data.products);
                    showToast('✅ Data berhasil dimuat dari DummyJSON API', false);
                } else {
                    throw new Error('Data kosong dari API');
                }
            } catch (error) {
                console.error('Fetch API gagal:', error);
                hpData = fallbackData;
                errorText.textContent = 'API gagal, menggunakan data lokal';
                showToast('⚠️ API gagal, menggunakan data lokal', true);
            } finally {
                loadingGrid.style.display = 'none';
                hpGrid.style.display = 'grid';
                renderHp(hpData);
            }
        }

        function showToast(msg, isError) {
            errorText.textContent = msg;
            errorToast.style.background = isError ? '#ef4444' : '#10b981';
            errorToast.classList.add('show');
            setTimeout(() => errorToast.classList.remove('show'), 3000);
        }

        function renderHp(data) {
            hpGrid.innerHTML = '';

            if (data.length === 0) {
                noResults.classList.add('show');
                return;
            }

            noResults.classList.remove('show');

            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'hp-card';
                card.style.animationDelay = `${index * 0.1}s`;
                card.innerHTML = `
                    <div class="image-wrapper">
                        <img class="card-image" src="${item.gambar}" alt="${item.nama}" loading="lazy" onerror="this.src='https://via.placeholder.com/600x400?text=Gambar+Tidak+Tersedia'">
                        <span class="brand-badge">${item.brand}</span>
                        <span class="stock-badge ${item.stok === 'Tersedia' ? 'tersedia' : 'habis'}">${item.stok}</span>
                    </div>
                    <div class="card-content">
                        <div class="card-header">
                            <h3 class="card-title">${item.nama}</h3>
                            <span class="card-price">${item.harga}</span>
                        </div>
                        <div class="card-specs">
                            <span class="spec-tag">📱 ${item.specs.layar}</span>
                            <span class="spec-tag">💾 ${item.specs.ram}</span>
                            <span class="spec-tag">🔋 ${item.specs.baterai}</span>
                        </div>
                        <p class="card-desc">${item.deskripsi}</p>
                        <div class="card-footer">
                            <div class="rating">
                                <span class="rating-star">⭐</span>
                                <span>${item.rating}</span>
                            </div>
                            <button class="detail-btn">Detail</button>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => openModal(item));
                hpGrid.appendChild(card);
            });
        }

        // ============================================
        // PERBAIKAN: Filter brand dengan case-insensitive
        // ============================================
        function filterHp() {
            const filtered = hpData.filter(item => {
                // Brand filter - case insensitive comparison
                let matchBrand = true;
                if (currentBrand !== 'all') {
                    matchBrand = item.brand.toLowerCase() === currentBrand.toLowerCase();
                }

                // Search filter
                const matchSearch = item.nama.toLowerCase().includes(currentSearch.toLowerCase()) ||
                                   item.deskripsi.toLowerCase().includes(currentSearch.toLowerCase());

                return matchBrand && matchSearch;
            });
            renderHp(filtered);
        }

        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            filterHp();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentBrand = btn.dataset.brand;
                filterHp();
            });
        });

        function openModal(item) {
            modalImage.src = item.gambar;
            modalImage.onerror = function() {
                this.src = 'https://via.placeholder.com/600x400?text=Gambar+Tidak+Tersedia';
            };
            modalTitle.textContent = item.nama;
            modalPrice.textContent = item.harga;
            modalBrand.textContent = item.brand;
            modalRating.textContent = `${item.rating} / 5.0`;
            modalStock.textContent = item.stok;
            modalStock.style.color = item.stok === 'Tersedia' ? '#059669' : '#dc2626';
            modalDesc.textContent = item.deskripsi;
            modalBuyBtn.textContent = `🛒 Beli ${item.nama}`;

            modalSpecs.innerHTML = `
                <div class="spec-item"><div class="spec-label">Layar</div><div class="spec-value">${item.specs.layar}</div></div>
                <div class="spec-item"><div class="spec-label">RAM</div><div class="spec-value">${item.specs.ram}</div></div>
                <div class="spec-item"><div class="spec-label">Storage</div><div class="spec-value">${item.specs.storage}</div></div>
                <div class="spec-item"><div class="spec-label">Baterai</div><div class="spec-value">${item.specs.baterai}</div></div>
            `;

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        modalBuyBtn.addEventListener('click', () => {
            modalBuyBtn.textContent = '✅ Ditambahkan ke Keranjang!';
            modalBuyBtn.style.background = '#10b981';
            setTimeout(() => {
                modalBuyBtn.textContent = `🛒 Beli ${modalTitle.textContent}`;
                modalBuyBtn.style.background = '';
                closeModal();
            }, 1200);
        });

        // Jalankan fetch saat halaman load
        fetchHpData();
    </script>
</body>
</html>
